source = ~/.config/colors/hypr.conf

general {
    ignore_empty_input = true
    fail_timeout = 300
}

background {
    monitor =
    path = screenshot

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_passes = 2
    blur_size = 5
    noise = 0.1
    contrast = 1
    brightness = 0.8172
    vibrancy = 0
    vibrancy_darkness = 1
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(151515)
    inner_color = rgb($primary-bg)
    font_color = rgb($primary)
    fade_on_empty = false
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i> </i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgb(255, 0, 0)
    fail_color = rgb(246, 64, 79)
    fail_text = <i> </i>
    capslock_color = rgb($complementary)
    numlock_color = rgb($secondary)
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below

    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>$TIME</b>
    font_size = 100
    font_family = monospace
    color = rgb($primary)
    position = 0, 300
    halign = center
    halign = center
}

label {
    text = cmd[update:1000] echo "$(date +"%A %d/%m/%Y")"

    font_size = 32
    font_family = monospace
    color = rgb($primary)

    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>Hi $USER !</b>
    color = rgb($secondary)
    font_size = 28
    font_family = monospace

    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] ~/.config/customScripts/battery.sh --text

    color = rgb($complementary)
    font_size = 20
    font_family = monospace
    position = 0, 300
    halign = center
    valign = bottom
}
